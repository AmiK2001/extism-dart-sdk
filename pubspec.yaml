name: dart_sdk
description: A sample command-line application.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.4.1

dependencies:
  path: ^1.9.1
  ffi: ^2.1.3
  meta: ^1.16.0
  crypto: ^3.0.6
  json_annotation: ^4.9.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  ffigen: ^16.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.11

ffigen:
  output: "lib/src/generated_bindings.dart"
  headers:
    entry-points:
      - "libs/extism.h"
  name: "LibExtism"
