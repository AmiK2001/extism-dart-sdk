name: dart_sdk
description: A sample command-line application.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  path: ^1.9.0
  ffi: ^2.1.3
  meta: ^1.15.0
  crypto: ^3.0.6
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  lint: ^2.3.0
  test: ^1.24.0
  ffigen: ^16.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.11
  freezed: ^2.5.7

ffigen:
  output: "lib/src/lib_extism.dart"
  headers:
    entry-points:
      - "headers/extism.h"
  name: "LibExtism"
